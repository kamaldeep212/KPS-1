  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;\">supported<\u002Fspan><\u002Fh2>\n        <\u002Fdiv>\n        <div class=\"kps-vgrid\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);\">\n          <sc-for list=\"{{ values }}\" as=\"v\" hint-placeholder-count=\"6\">\n            <div data-reveal=\"\" data-reveal-delay=\"{{ v.delay }}\" style=\"background:#0D2545;padding:32px 30px;display:flex;flex-direction:column;gap:16px;transition:background .3s ease;\" style-hover=\"background:#10294f;\">\n              <img data-src=\"{{ v.icon }}\" alt=\"\" style=\"width:40px;height:40px;display:block;\">\n              <h3 style=\"font-family:Syne,sans-serif;font-weight:700;font-size:18.5px;color:#fff;margin:0;\">{{ v.title }}<\u002Fh3>\n              <p style=\"font-size:14px;line-height:1.6;color:rgba(255,255,255,.6);margin:0;\">{{ v.desc }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ===================== NEWS & EVENTS ===================== -->\n    <section id=\"news\" class=\"kps-sec\" style=\"max-width:1280px;margin:0 auto;padding:clamp(80px,9vw,130px) clamp(18px,4vw,44px);\">\n      <div data-reveal=\"\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:clamp(38px,4vw,56px);\">\n        <div style=\"max-width:600px;\">\n          <span style=\"display:inline-flex;align-items:center;gap:12px;font-size:12.5px;font-weight:600;letter-spacing:.24em;color:#C9973A;text-transform:uppercase;margin-bottom:20px;\"><span style=\"width:30px;height:2px;background:#C9973A;display:inline-block;\"><\u002Fspan>News &amp; events<\u002Fspan>\n          <h2 style=\"font-family:Syne,sans-serif;font-weight:800;font-size:clamp(30px,3.4vw,46px);line-height:1.08;letter-spacing:-.015em;color:#0D2545;margin:0;text-wrap:balance;\">What's happening at Kilmore PS<\u002Fh2>\n        <\u002Fdiv>\n        <a href=\"#news\" style=\"font-weight:700;font-size:14.5px;color:#0D2545;text-decoration:none;border-bottom:2px solid #C9973A;padding-bottom:4px;white-space:nowrap;\">View all news →<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:26px;\">\n        <sc-for list=\"{{ news }}\" as=\"n\" hint-placeholder-count=\"3\">\n          <a href=\"#news\" data-reveal=\"\" data-reveal-delay=\"{{ n.delay }}\" style=\"display:flex;flex-direction:column;background:#fff;text-decoration:none;box-shadow:0 18px 40px -30px rgba(13,37,69,.5);transition:transform .3s ease,box-shadow .3s ease;\" style-hover=\"transform:translateY(-6px);box-shadow:0 30px 56px -28px rgba(13,37,69,.5);\">\n            <div style=\"position:relative;overflow:hidden;\">\n              <image-slot id=\"{{ n.slot }}\" placeholder=\"Drop a photo\" fit=\"cover\" radius=\"0\" shape=\"rect\" style=\"width:100%;height:208px;\"><\u002Fimage-slot>\n              <span style=\"position:absolute;left:0;top:0;background:#C9973A;color:#0D2545;display:flex;flex-direction:column;align-items:center;justify-content:center;width:64px;height:64px;line-height:1;\">\n                <span style=\"font-family:Syne,sans-serif;font-weight:800;font-size:24px;\">{{ n.day }}<\u002Fspan>\n                <span style=\"font-size:10.5px;font-weight:700;letter-spacing:.12em;margin-top:2px;\">{{ n.mon }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:24px 26px 30px;display:flex;flex-direction:column;flex:1;\">\n              <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#C9973A;margin-bottom:12px;\">{{ n.tag }}<\u002Fspan>\n              <h3 style=\"font-family:Syne,sans-serif;font-weight:700;font-size:20px;line-height:1.2;color:#0D2545;margin:0 0 12px;\">{{ n.title }}<\u002Fh3>\n              <p style=\"font-size:14px;line-height:1.6;color:#6b7280;margin:0 0 18px;\">{{ n.desc }}<\u002Fp>\n              <span style=\"margin-top:auto;font-size:13.5px;font-weight:700;color:#0D2545;\">Read more →<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ===================== ENROLMENT CTA ===================== -->\n    <section id=\"enrol\" style=\"position:relative;background:#0D2545;overflow:hidden;\">\n      <span aria-hidden=\"true\" style=\"position:absolute;left:-8%;bottom:-22%;font-family:Syne,sans-serif;font-weight:800;font-size:70vh;line-height:.8;color:rgba(255,255,255,.05);user-select:none;pointer-events:none;z-index:0;\">K<\u002Fspan>\n      <div style=\"position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:clamp(80px,9vw,140px) clamp(18px,4vw,44px);display:grid;grid-template-columns:1fr;gap:0;\">\n        <div data-reveal=\"\" style=\"max-width:680px;\">\n          <span style=\"display:inline-flex;align-items:center;gap:12px;font-size:12.5px;font-weight:600;letter-spacing:.24em;color:#E0B463;text-transform:uppercase;margin-bottom:22px;\"><span style=\"width:30px;height:2px;background:#C9973A;display:inline-block;\"><\u002Fspan>Enrolments open<\u002Fspan>\n          <h2 style=\"font-family:Syne,sans-serif;font-weight:800;font-size:clamp(32px,4.2vw,58px);line-height:1.04;letter-spacing:-.02em;color:#fff;margin:0 0 22px;text-wrap:balance;\">Begin your family's journey at Kilmore&nbsp;<span style=\"color:#C9973A;\">PS<\u002Fspan><\u002Fh2>\n          <p style=\"font-size:clamp(16px,1.5vw,19px);line-height:1.6;color:rgba(255,255,255,.8);max-width:560px;margin:0 0 36px;\">Foundation 2026 enrolments are now open. Come and see our school in action — we'd love to show you around.<\u002Fp>\n          <div class=\"kps-cta-row\" style=\"display:flex;gap:14px;flex-wrap:wrap;\">\n            <a href=\"#footer\" style=\"font-weight:700;font-size:15.5px;letter-spacing:.02em;color:#0D2545;background:#C9973A;padding:16px 30px;text-decoration:none;transition:background .2s ease,transform .2s ease;\" style-hover=\"background:#e0b463;transform:translateY(-2px);\">Start enrolment<\u002Fa>\n            <a href=\"#footer\" style=\"font-weight:600;font-size:15.5px;letter-spacing:.02em;color:#fff;background:transparent;border:1.5px solid rgba(255,255,255,.55);padding:16px 30px;text-decoration:none;transition:border-color .2s ease,background .2s ease;\" style-hover=\"border-color:#fff;background:rgba(255,255,255,.08);\">Arrange a tour<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fmain>\n\n  <!-- ===================== FOOTER ===================== -->\n  <footer id=\"footer\" style=\"background:#0A1D38;color:rgba(255,255,255,.7);\">\n    <div style=\"height:3px;background:linear-gradient(90deg,#C9973A,#0A1D38);\"><\u002Fdiv>\n    <div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,90px) clamp(18px,4vw,44px) 40px;\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:44px 40px;\">\n        <div style=\"grid-column:span 1;min-width:220px;\">\n          <div style=\"display:flex;align-items:center;gap:13px;margin-bottom:22px;\">\n            <span style=\"width:50px;height:50px;border-radius:50%;background:#F9F7F4;display:flex;align-items:center;justify-content:center;flex-shrink:0;\">\n              <img src=\"f3590c50-0578-4b5f-a346-3d5a529e6ae1\" alt=\"Kilmore Primary School crest\" style=\"width:42px;height:42px;display:block;\">\n            <\u002Fspan>\n            <span style=\"width:1.5px;height:34px;background:#C9973A;\"><\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;line-height:1;\">\n              <span style=\"font-family:Syne,sans-serif;font-weight:700;font-size:16px;letter-spacing:.12em;color:#fff;\">KILMORE<\u002Fspan>\n              <span style=\"font-family:Inter,sans-serif;font-weight:600;font-size:10px;letter-spacing:.32em;color:#C9973A;margin-top:3px;\">PRIMARY SCHOOL<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.65;margin:0;max-width:280px;\">A welcoming government primary school nurturing confident, caring and curious learners in Kilmore, Victoria.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <h4 style=\"font-family:Syne,sans-serif;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#fff;margin:0 0 18px;\">Explore<\u002Fh4>\n          <div style=\"display:flex;flex-direction:column;gap:11px;\">\n            <a href=\"#welcome\" style=\"font-size:14px;color:rgba(255,255,255,.7);text-decoration:none;\" style-hover=\"color:#C9973A;\">About our school<\u002Fa>\n            <a href=\"#learning\" style=\"font-size:14px;color:rgba(255,255,255,.7);text-decoration:none;\" style-hover=\"color:#C9973A;\">Teaching &amp; learning<\u002Fa>\n            <a href=\"#values\" style=\"font-size:14px;color:rgba(255,255,255,.7);text-decoration:none;\" style-hover=\"color:#C9973A;\">Wellbeing<\u002Fa>\n            <a href=\"#news\" style=\"font-size:14px;color:rgba(255,255,255,.7);text-decoration:none;\" style-hover=\"color:#C9973A;\">News &amp; events<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h4 style=\"font-family:Syne,sans-serif;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#fff;margin:0 0 18px;\">For families<\u002Fh4>\n          <div style=\"display:flex;flex-direction:column;gap:11px;\">\n            <a href=\"#enrol\" style=\"font-size:14px;color:rgba(255,255,255,.7);text-decoration:none;\" style-hover=\"color:#C9973A;\">Enrolment<\u002Fa>\n            <a href=\"#\" style=\"font-size:14px;color:rgba(255,255,255,.7);text-decoration:none;\" style-hover=\"color:#C9973A;\">Term dates<\u002Fa>\n            <a href=\"#\" style=\"font-size:14px;color:rgba(255,255,255,.7);text-decoration:none;\" style-hover=\"color:#C9973A;\">Newsletters<\u002Fa>\n            <a href=\"#\" style=\"font-size:14px;color:rgba(255,255,255,.7);text-decoration:none;\" style-hover=\"color:#C9973A;\">Parent portal<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h4 style=\"font-family:Syne,sans-serif;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#fff;margin:0 0 18px;\">Visit us<\u002Fh4>\n          <div style=\"display:flex;flex-direction:column;gap:11px;font-size:14px;line-height:1.5;\">\n            <span>[Street address]<br>Kilmore VIC 3764<\u002Fspan>\n            <span>(03) [phone number]<\u002Fspan>\n            <a href=\"mailto:\" style=\"color:#C9973A;text-decoration:none;\">kilmore.ps@education.vic.gov.au<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(255,255,255,.1);margin-top:48px;padding-top:26px;\">\n        <p style=\"font-size:12.5px;line-height:1.65;color:rgba(255,255,255,.5);margin:0 0 18px;max-width:760px;\">Kilmore Primary School acknowledges the Taungurung people, the Traditional Owners of the land on which our school stands, and pays respect to Elders past and present. We are committed to a future of mutual respect and understanding.<\u002Fp>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;\">\n          <span style=\"font-size:12.5px;color:rgba(255,255,255,.45);\">© 2026 Kilmore Primary School. All rights reserved.<\u002Fspan>\n          <span style=\"font-size:12.5px;color:rgba(255,255,255,.45);\"><br><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { menuOpen: false };\n\n  bindIcons() {\n    document.querySelectorAll('img[data-src]').forEach(i => {\n      const s = i.getAttribute('data-src');\n      if (s && s.indexOf('{{') === -1 && i.getAttribute('src') !== s) i.setAttribute('src', s);\n    });\n  }\n\n  componentDidMount() {\n    // ---- Resolve data-src icons (avoids literal {{ }} ever sitting in a src) ----\n    this.bindIcons();\n    setTimeout(() => this.bindIcons(), 60);\n    setTimeout(() => this.bindIcons(), 400);\n\n    // ---- Responsive layer (media queries inline styles can't express) ----\n    if (!document.getElementById('kps-responsive')) {\n      const s = document.createElement('style');\n      s.id = 'kps-responsive';\n      s.textContent = `\n        @media (max-width: 1160px){\n          .kps-desknav{display:none !important;}\n          .kps-burger{display:inline-flex !important;}\n        }\n        @media (max-width: 880px){\n          .kps-hero{padding-top:128px !important;}\n          .kps-hero-grid{grid-template-columns:1fr !important;min-height:0 !important;}\n          .kps-split{grid-template-columns:1fr !important;}\n          .kps-split-img{order:-1;}\n          .kps-ghostK{font-size:120vw !important;}\n        }\n        @media (max-width: 760px){\n          .kps-vgrid{grid-template-columns:repeat(2,1fr) !important;}\n        }\n        @media (max-width: 480px){\n          .kps-vgrid{grid-template-columns:1fr !important;}\n        }\n        @media (max-width: 540px){\n          .kps-cta-row{flex-direction:column !important;align-items:stretch !important;}\n          .kps-cta-row a{text-align:center !important;}\n        }\n      `;\n      document.head.appendChild(s);\n    }\n\n    // ---- Scroll reveal ----\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    els.forEach(el => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(28px)';\n      el.style.transition = 'opacity .75s cubic-bezier(.2,.7,.2,1), transform .75s cubic-bezier(.2,.7,.2,1)';\n      el.style.willChange = 'opacity, transform';\n    });\n    const reveal = el => { el.style.opacity = '1'; el.style.transform = 'none'; };\n    if ('IntersectionObserver' in window) {\n      const io = new IntersectionObserver((entries) => {\n        entries.forEach(e => {\n          if (e.isIntersecting) {\n            const el = e.target;\n            const d = parseInt(el.getAttribute('data-reveal-delay') || '0', 10);\n            setTimeout(() => reveal(el), d);\n            io.unobserve(el);\n          }\n        });\n      }, { threshold: 0.12, rootMargin: '0px 0px -7% 0px' });\n      els.forEach(el => io.observe(el));\n      // safety net\n      this._safety = setTimeout(() => {\n        els.forEach(el => { if (getComputedStyle(el).opacity === '0') reveal(el); });\n      }, 4000);\n    } else {\n      els.forEach(reveal);\n    }\n\n    // ---- Header shadow + hero parallax on scroll ----\n    const hdr = document.getElementById('kps-header');\n    const heroImg = document.getElementById('kps-hero-img');\n    this._onScroll = () => {\n      const y = window.scrollY || 0;\n      if (hdr) {\n        if (y > 16) { hdr.style.boxShadow = '0 10px 34px rgba(5,16,32,.35)'; hdr.style.background = 'rgba(13,37,69,.97)'; }\n        else { hdr.style.boxShadow = 'none'; hdr.style.background = 'rgba(13,37,69,.86)'; }\n      }\n      // (parallax removed — hero image now lives in a contained card)\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    if (this._safety) clearTimeout(this._safety);\n  }\n\n  componentDidUpdate(prevProps, prevState) {\n    // lock body scroll when mobile menu open\n    document.body.style.overflow = this.state.menuOpen ? 'hidden' : '';\n  }\n\n  renderVals() {\n    const R = (window.__resources) || {};\n    const ICON = (name) => R[name] || ('assets/icons/' + name + '.png');\n    return {\n      menuOpen: this.state.menuOpen,\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n\n      quickLinks: [\n        { icon: ICON('comm-events-navy'), label: 'Term Dates', desc: 'Key dates & calendar', href: '#news', delay: 0 },\n        { icon: ICON('nav-news-navy'), label: 'Newsletters', desc: 'Latest from school', href: '#news', delay: 80 },\n        { icon: ICON('nav-parents-navy'), label: 'Parent Portal', desc: 'Compass & forms', href: '#footer', delay: 160 },\n        { icon: ICON('nav-contact-navy'), label: 'Contact Us', desc: 'Get in touch', href: '#footer', delay: 240 },\n      ],\n\n      programs: [\n        { icon: ICON('nav-learning-white'), title: 'Literacy & Reading', desc: 'A love of reading and confident communication from the very first day.', delay: 0 },\n        { icon: ICON('acad-numeracy-white'), title: 'Numeracy & Maths', desc: 'Building strong number sense and real-world problem solving.', delay: 90 },\n        { icon: ICON('acad-stem-white'), title: 'STEM & Inquiry', desc: 'Hands-on science, technology and curiosity-driven investigation.', delay: 180 },\n        { icon: ICON('acad-music-white'), title: 'Music & The Arts', desc: 'Creativity, performance and self-expression for every child.', delay: 270 },\n      ],\n\n      values: [\n        { icon: ICON('life-wellbeing-white'), title: 'Wellbeing', desc: 'Happy, healthy learners supported every day.', delay: 0 },\n        { icon: ICON('life-inclusion-white'), title: 'Inclusion', desc: 'Every child welcomed, valued and respected.', delay: 70 },\n        { icon: ICON('life-safety-white'), title: 'Safety', desc: 'A safe, predictable place to learn and grow.', delay: 140 },\n        { icon: ICON('life-environment-white'), title: 'Sustainability', desc: 'Caring for our environment and community.', delay: 210 },\n        { icon: ICON('life-achievement-white'), title: 'Achievement', desc: 'High expectations and celebrated growth.', delay: 280 },\n        { icon: ICON('life-family-white'), title: 'Family', desc: 'Strong partnerships between school and home.', delay: 350 },\n      ],\n\n      news: [\n        { slot: 'kps-news-1', day: '12', mon: 'JUN', tag: 'Enrolments', title: 'Foundation 2026 enrolments now open', desc: 'Tours are filling fast — book a time to come and meet our team.', delay: 0 },\n        { slot: 'kps-news-2', day: '20', mon: 'JUN', tag: 'Community', title: 'Twilight picnic & community night', desc: 'Bring a rug and join us on the oval for an evening of fun.', delay: 110 },\n        { slot: 'kps-news-3', day: '02', mon: 'JUL', tag: 'Sport', title: 'Junior athletics carnival results', desc: 'A wonderful day of effort, teamwork and house spirit.', delay: 220 },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
